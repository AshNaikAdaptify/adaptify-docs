site_name: Adaptify Docs
site_url: https://ashnaikadaptify.github.io/adaptify-docs/
site_description: Documentation for the Adaptify platform
repo_url: https://github.com/AshNaikAdaptify/adaptify-docs
repo_name: AshNaikAdaptify/adaptify-docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/adaptify-logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features: [navigation.indexes, navigation.footer, toc.follow, search.suggest, search.highlight]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/features.js]
extra:
  feedback_repo: AshNaikAdaptify/adaptify-docs
  # support_url stays unset until Ash confirms the real Adaptify support URL.
  # An empty or missing value renders no contact link.
markdown_extensions: [admonition, attr_list, md_in_html, toc: {permalink: true, title: On this page}]
plugins:
  - search
  - redirects:
      redirect_maps:
        workbench/projects.md: workbench/create-project/index.md  # retired in PR #22
      # The other four land in the content PR that retires each old page.
      # Never add one while that source file still exists. Assets are not redirected.
      # product-vault/product-import/index.md: product-vault/bring-in-a-product.md
      # product-vault/product-import/create-product.md: product-vault/create-product.md
      # product-vault/product-import/upload-files.md: product-vault/import-documents.md
      # product-vault/product-import/process-and-extract-rules.md: product-vault/process-documents/index.md
      # Audience hook: redirects records pages in on_files, before that hook
      # drops internal pages. A target excluded from the external build does
      # not fail the build. The redirect HTML is still written; the target
      # page is not in the external site. The internal build has both.
nav:
  # Section order follows the site plan of record (site-plan-ash-v3.md). Planned sections
  # with no pages yet (added in later phases): Release to New Release (after Project
  # Workbench), Intelligence, Reports, Administration (before Reference).
  # Each section's index page is the unlabeled first child so the section label is a link.
  - Home: index.md
  - Introduction:
      - get-started/index.md
      - Adaptify at a glance: get-started/components.md
      - Sign in and Org Setup: get-started/sign-in.md
      - Your Dashboard: get-started/dashboard.md
      - "Your first 10 minutes: tour a product": get-started/quickstart.md
  - Product Vault:
      - product-vault/index.md
      - Bring a product into the Vault: product-vault/bring-in-a-product.md
      - Before you start: product-vault/before-you-start.md
      - Create a product: product-vault/create-product.md
      - Upload documents for a state: product-vault/import-documents.md
      - Add metadata and process documents:
          - product-vault/process-documents/index.md
          - Add form numbers and editions: product-vault/process-documents/form-metadata.md
          - Add manual editions and set up rules: product-vault/process-documents/manual-editions-and-rules.md
          - Process documents and check the rules: product-vault/process-documents/run-processing.md
      - Review and publish: product-vault/review-and-publish.md
      - Understand releases: product-vault/releases.md
      - Shared assets across states: product-vault/shared-assets.md
      - Add a state to a product:
          - product-vault/add-a-state/index.md
          - Add a state with Edit product: product-vault/add-a-state/edit-product.md
          - Copy a state's forms to a new state: product-vault/add-a-state/from-existing-state.md
      - Delete a State: product-vault/delete-a-state.md
      - Delete Product: product-vault/delete-product.md
  - Project Workbench:
      - workbench/index.md
      - Create a project:
          - workbench/create-project/index.md
          - Start a product update: workbench/create-project/product-update.md
          - Start a project to add a state: workbench/create-project/new-jurisdiction.md
      - Update forms: workbench/update-forms.md
      - Update rates: workbench/update-rates.md
      - Update rules: workbench/update-rules.md
      - Move work through phases: workbench/phases.md
      - "Complete a project: Admitted or Non-admitted":
          - workbench/complete-project/index.md
          - Complete as Admitted (create filings): workbench/complete-project/admitted.md
          - Complete as Non-admitted: workbench/complete-project/non-admitted.md
      - Build a new product in Workbench:
          - workbench/new-product/index.md
          - Start a new product project: workbench/new-product/start.md
          - Add the product's documents: workbench/new-product/add-documents.md
          - Finish and publish the new product: workbench/new-product/finish.md
  - Release to New Release:
      - release-to-new-release/index.md
      - 1. Update your product in Workbench: release-to-new-release/update-in-workbench.md
      - 2. Create filings from your project: release-to-new-release/create-filings.md
      - 4. File with the state and record the submission: release-to-new-release/submit-to-state.md
      - 5. Track objections and responses: release-to-new-release/handle-objections.md
      - 6. Record approval and archive: release-to-new-release/approve-and-archive.md
      - 7. Check the new release: release-to-new-release/check-new-release.md
  - Filing Manager:
      - filing-manager/index.md
      - Filing statuses and dispositions: filing-manager/statuses.md
  - Rating:
      - How rating works: rating/index.md
      - Rating Catalog: rating-catalog/index.md
      - Rating structures: rating/rating-structures.md
      - Open a rater: rating/open-a-rater.md
      - Rating tables: rating/rating-tables.md
      - Calculations: rating/calculations.md
      - Rate order: rating/rate-order.md
      - Test a rater: rating/test-a-rater.md
  - Intelligence:
      - intelligence/index.md
      - Clause Library: intelligence/clause-library.md
      - Statute Library: intelligence/statute-library.md
      - Objection Library: intelligence/objection-library.md
  - Reports:
      - reports/index.md
  - Reference:
      - reference/index.md
      - Glossary: reference/glossary.md
  - Support:
      - support/index.md

hooks:
  - hooks/audience.py
