site_name: Adaptify Docs
site_url: https://ashnaikadaptify.github.io/adaptify-docs/
site_description: Documentation for the Adaptify platform
repo_url: https://github.com/AshNaikAdaptify/adaptify-docs
repo_name: AshNaikAdaptify/adaptify-docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/adaptify-logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features: [navigation.sections, navigation.expand, navigation.indexes, navigation.footer, toc.follow, search.suggest, search.highlight]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/features.js]
extra:
  feedback_repo: AshNaikAdaptify/adaptify-docs
  support_url: https://adaptify.com/  # TODO verify: placeholder until Ash confirms the real Adaptify support URL
markdown_extensions: [admonition, attr_list, md_in_html, toc: {permalink: true, title: On this page}]
nav:
  # Section order follows the site plan of record (site-plan-ash-v3.md). Planned sections
  # with no pages yet (added in later phases): Release to New Release (after Project
  # Workbench), Intelligence, Reports, Administration (before Reference).
  - Home: index.md
  - Introduction:
      - Get Started: get-started/index.md
      - Adaptify at a glance: get-started/components.md
      - Sign in and Org Setup: get-started/sign-in.md
      - Your Dashboard: get-started/dashboard.md
      - "Your first 10 minutes: tour a product": get-started/quickstart.md
  - Product Vault:
      - Product Vault overview: product-vault/index.md
      - Bring a product into the Vault: product-vault/bring-in-a-product.md
      - Before you start: product-vault/before-you-start.md
      - Create a product: product-vault/create-product.md
      - Upload documents for a state: product-vault/import-documents.md
      - Add metadata and process documents:
          - product-vault/process-documents/index.md
          - Add form numbers and editions: product-vault/process-documents/form-metadata.md
          - Add manual editions and set up rules: product-vault/process-documents/manual-editions-and-rules.md
          - Process documents and check the rules: product-vault/process-documents/run-processing.md
      - Review and publish: product-vault/review-and-publish.md
      - Understand releases: product-vault/releases.md
  - Project Workbench:
      - Workbench overview: workbench/index.md
      - Create a project:
          - workbench/create-project/index.md
          - Start a product update: workbench/create-project/product-update.md
      - Update forms: workbench/update-forms.md
      - Update rates: workbench/update-rates.md
  - Filing Manager:
      - Filing Manager overview: filing-manager/index.md
  - Rating Sandbox:
      - Rating Sandbox overview: sandbox/index.md
  - Rating Catalog:
      - Rating Catalog overview: rating-catalog/index.md
  - Reference:
      - Glossary: reference/glossary.md
  - Support:
      - Support: support/index.md
