site_name: Adaptify Docs
site_url: https://ashnaikadaptify.github.io/adaptify-docs/
site_description: Documentation for the Adaptify platform
repo_url: https://github.com/AshNaikAdaptify/adaptify-docs
repo_name: AshNaikAdaptify/adaptify-docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/adaptify-logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features: [navigation.sections, navigation.expand, navigation.footer, toc.follow, search.suggest, search.highlight]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/features.js]
extra:
  feedback_repo: AshNaikAdaptify/adaptify-docs
  support_url: https://adaptify.com/  # TODO: replace with the real Adaptify support URL
markdown_extensions: [admonition, attr_list, md_in_html, toc: {permalink: true, title: On this page}]
nav:
  - Home: index.md
  - Introduction:
      - Get Started: get-started/index.md
      - get-started/dashboard.md
      - get-started/components.md
      - get-started/sign-in.md
  - Product Vault:
      - product-vault/index.md
      - product-vault/before-you-start.md
      - product-vault/create-product.md
      - product-vault/import-documents.md
      - product-vault/process-documents.md
      - product-vault/review-and-publish.md
      - Product import:
          - product-vault/product-import/index.md
          - product-vault/product-import/create-product.md
          - product-vault/product-import/upload-files.md
          - product-vault/product-import/process-and-extract-rules.md
  - Workbench: [workbench/index.md, workbench/projects.md]
  - Release to New Release:
      - Overview: release-to-new-release/index.md
      - 1. Update your product in Workbench: release-to-new-release/update-in-workbench.md
      - 2. Create filings from your project: release-to-new-release/create-filings.md
      - 4. File with the state and record the submission: release-to-new-release/submit-to-state.md
      - 5. Track objections and responses: release-to-new-release/handle-objections.md
      - 6. Record approval and archive: release-to-new-release/approve-and-archive.md
      - 7. Check the new release: release-to-new-release/check-new-release.md
  - Sandbox: [sandbox/index.md]
  - Filing Manager: [filing-manager/index.md]
  - Rating Catalog: [rating-catalog/index.md]
  - Reference: [reference/glossary.md]
  - Support: [support/index.md]
