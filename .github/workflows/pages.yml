name: Pages

# Internal site on GitHub Pages.
#
# Prototype note: bots act on GitHub as Ash (AshNaikAdaptify). This workflow
# does not take that further. It uses the default GITHUB_TOKEN only, reads
# no repository secrets, and is not pull_request_target. A fork pull request
# therefore cannot run this file with write access. pr-preview-action v1
# cannot publish fork previews without a secret or pull_request_target, so
# fork PRs are skipped.
#
# Pages stays "Deploy from a branch" (gh-pages, folder /). actions/deploy-pages
# publishes one artifact as the whole site and would delete pr-preview/ on
# every main deploy. JamesIves keeps that directory (clean-exclude) and does
# not force-push (force: false), so a main deploy does not wipe previews.
# One concurrency group serializes main deploys and preview updates, which
# both commit to gh-pages.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned MkDocs
        run: python -m pip install -r requirements.txt

      - name: Build internal site
        env:
          DOCS_AUDIENCE: internal
        run: mkdocs build --strict --site-dir site

      - name: Publish gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
          force: false

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build internal site
        if: github.event.action != 'closed'
        env:
          DOCS_AUDIENCE: internal
        run: |
          python -m pip install -r requirements.txt
          mkdocs build --strict --site-dir site

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          qr-code: "false"
