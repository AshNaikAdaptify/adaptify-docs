name: CI

# Builds both audiences in strict mode, checks the external output for
# internal pages, paths and assets, and checks the redirect map.
# No secrets. pull_request (not pull_request_target), so a fork cannot
# receive credentials.
#
# Prototype note: bots act on GitHub as Ash (AshNaikAdaptify). This workflow
# does not use that identity. It only reads the repo with the default token.

on:
  # ready_for_review is not in the default pull_request set. A push from
  # cursor[bot] does not start Actions; marking the PR ready does.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned MkDocs
        run: python -m pip install -r requirements.txt

      - name: Reject inline styles
        run: python scripts/check_inline_styles.py

      - name: Check redirect map
        run: python scripts/check_redirects.py

      - name: Build internal site
        env:
          DOCS_AUDIENCE: internal
        run: mkdocs build --strict --site-dir site-internal

      - name: Build external site
        env:
          DOCS_AUDIENCE: external
        run: mkdocs build --strict --site-dir site-external

      - name: Check external output
        run: python scripts/audience_check.py --site site-external --expect external

      - name: Check internal output
        run: python scripts/audience_check.py --site site-internal --expect internal

      - name: Prove the audience contract
        run: bash scripts/prove_audience.sh

      - name: Upload external site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-site
          path: site-external
          retention-days: 14
          if-no-files-found: error
